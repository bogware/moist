name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on:
      group: Default
      labels: [Windows]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet

    steps:
      - uses: actions/checkout@v4

      # Directory.Build.props is the single source of truth for <Version> (it stamps
      # the whole solution), while the tag names the release/archives. If they drift,
      # the shipped binary reports the wrong version via `moist --version` and
      # `GET /api/health`. Fail fast rather than publish a mislabelled release.
      - name: Verify version matches tag
        working-directory: src
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) != Directory.Build.props <Version> ($VER). Bump Directory.Build.props before tagging."
            exit 1
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Run tests
        working-directory: src
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish (Windows x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/win-x64

      - name: Publish (Windows x64, framework-dependent)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ../publish/win-x64-fdd

      - name: Publish CLI (Windows x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.Cli/Moist.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/win-x64-cli

      - name: Create ZIP archives
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath publish/moist-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path publish/win-x64-fdd/* -DestinationPath publish/moist-${{ github.ref_name }}-win-x64-fdd.zip
          Compress-Archive -Path publish/win-x64-cli/* -DestinationPath publish/moist-cli-${{ github.ref_name }}-win-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: publish/moist-*.zip

  build-linux:
    name: Build Linux Release
    runs-on:
      group: Default
      labels: [Linux]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@v4

      # Directory.Build.props is the single source of truth for <Version> (it stamps
      # the whole solution), while the tag names the release/archives. If they drift,
      # the shipped binary reports the wrong version via `moist --version` and
      # `GET /api/health`. Fail fast rather than publish a mislabelled release.
      - name: Verify version matches tag
        working-directory: src
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) != Directory.Build.props <Version> ($VER). Bump Directory.Build.props before tagging."
            exit 1
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Run tests
        working-directory: src
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish (Linux x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/linux-x64

      - name: Publish CLI (Linux x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.Cli/Moist.Cli.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/linux-x64-cli

      - name: Create tar.gz archives
        run: |
          cd publish/linux-x64
          tar -czf ../moist-${{ github.ref_name }}-linux-x64.tar.gz *
          cd ../linux-x64-cli
          tar -czf ../moist-cli-${{ github.ref_name }}-linux-x64.tar.gz *

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: publish/moist-*-linux-*.tar.gz

