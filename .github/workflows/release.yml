name: Release

# One manual run makes a release: check the inputs, build every artifact from one resolved commit,
# tag that commit, and publish. Start it from the Actions tab, or:
#   gh workflow run release.yml --ref main -f version=1.0.0
#
# Why not "push a tag"? The organisation restricts tag creation to automation — people can't push
# tags, github-actions[bot] can — so the tag is created here, through the API, only after every
# build has succeeded. A failed run therefore leaves no stray tag behind.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.0 or 1.1.0-rc.1 (no leading v; a "-" marks a pre-release). Must match src/Directory.Build.props.
        required: true
        type: string
      ref:
        description: Branch, tag or full commit SHA to release. Leave as main unless you mean otherwise.
        required: true
        default: main
        type: string

# Read-only unless a job says otherwise; only the publish job can write.
permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check inputs
    runs-on:
      group: Default
      labels: [Linux]
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Inputs reach the script only as environment variables, and are validated before use.
      - name: Validate version, commit and tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc.1 (no leading v), got '$VERSION'"; exit 1
          fi
          # Directory.Build.props stamps the whole solution, so `moist --version` and
          # GET /api/health report it. A release named differently would be mislabelled.
          PROPS=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Directory.Build.props)
          if [[ "$PROPS" != "$VERSION" ]]; then
            echo "::error::Directory.Build.props says $PROPS, not $VERSION. Bump it first."; exit 1
          fi
          SHA=$(git rev-parse HEAD)
          TAG="v$VERSION"
          # A tag left by an earlier failed run is fine on the same commit, never on another.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            [[ "$existing" == "$SHA" ]] || { echo "::error::$TAG already exists on $existing, not $SHA"; exit 1; }
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            echo "::error::$TAG is already published"; exit 1
          fi
          # The release notes are the changelog's section for this version; insist it exists.
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $SHA"

  build-windows:
    name: Build Windows
    needs: prepare
    # GitHub-hosted on purpose: SignPath (code signing for open-source projects) only signs
    # builds it can attest came from a GitHub-hosted runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Run tests
        working-directory: src
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish (Windows x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/win-x64

      - name: Publish (Windows x64, framework-dependent)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ../publish/win-x64-fdd

      - name: Publish CLI (Windows x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.Cli/Moist.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/win-x64-cli

      # ---- Code signing (SignPath Foundation) --------------------------------------------
      # Runs only once the project is set up with SignPath: set repository variable
      # SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN (see SECURITY.md, "Release
      # signing"). Until then releases ship unsigned and Windows SmartScreen will warn.
      # What gets signed inside the artifact is defined by .signpath/artifact-configuration.xml,
      # which must be uploaded to the SignPath project as its artifact configuration.
      - name: Upload unsigned binaries for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            publish/win-x64
            publish/win-x64-fdd
            publish/win-x64-cli

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'moist' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish-signed

      - name: Use the signed binaries
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          foreach ($d in 'win-x64', 'win-x64-fdd', 'win-x64-cli') {
            if (-not (Test-Path "publish-signed/$d")) { throw "SignPath returned no $d folder" }
            Remove-Item -Recurse -Force "publish/$d"
            Move-Item "publish-signed/$d" "publish/$d"
          }
          # Fail rather than ship an unsigned exe labelled as signed.
          Get-ChildItem publish -Recurse -Include moist.exe, Moist.App.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "$($_.FullName) is not validly signed: $($sig.Status)" }
            Write-Host "signed: $($_.FullName) ($($sig.SignerCertificate.Subject))"
          }

      - name: Create ZIP archives
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}   # via env, not interpolated into the script
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath "publish/moist-$env:TAG-win-x64.zip"
          Compress-Archive -Path publish/win-x64-fdd/* -DestinationPath "publish/moist-$env:TAG-win-x64-fdd.zip"
          Compress-Archive -Path publish/win-x64-cli/* -DestinationPath "publish/moist-cli-$env:TAG-win-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: publish/moist-*.zip

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on:
      group: Default
      labels: [Linux]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Run tests
        working-directory: src
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish (Linux x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.App/Moist.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/linux-x64

      - name: Publish CLI (Linux x64, self-contained)
        working-directory: src
        run: >
          dotnet publish Moist.Cli/Moist.Cli.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output ../publish/linux-x64-cli

      - name: Create tar.gz archives
        env:
          TAG: ${{ needs.prepare.outputs.tag }}   # via env, not interpolated into the script
        run: |
          cd publish/linux-x64
          tar -czf "../moist-$TAG-linux-x64.tar.gz" ./*
          cd ../linux-x64-cli
          tar -czf "../moist-cli-$TAG-linux-x64.tar.gz" ./*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: publish/moist-*-linux-*.tar.gz

  publish:
    name: Tag and publish
    needs: [prepare, build-windows, build-linux]
    runs-on:
      group: Default
      labels: [Linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-release'

      # Published beside the archives so downloads can be verified (sha256sum -c SHA256SUMS.txt).
      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} . \;
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on                    { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # The tag is created only now, after every build succeeded, and by github-actions[bot] —
      # the identity the organisation lets create tags.
      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            [[ "$existing" == "$SHA" ]] || { echo "::error::$TAG already exists on $existing"; exit 1; }
            echo "$TAG already points at $SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null
            echo "Tagged $SHA as $TAG"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: moist ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
