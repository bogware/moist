  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]  # Add build-macos when enabled
    runs-on:
      group: Default
      labels: [Linux]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-release'

      # Published beside the archives so downloads can be verified (sha256sum -c SHA256SUMS.txt).
      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} . \;
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
