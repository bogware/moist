name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build & Test (Windows)
    runs-on:
      group: Default
      labels: [Windows]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build (Debug)
        working-directory: src
        run: dotnet build --no-restore --configuration Debug

      - name: Build (Release)
        working-directory: src
        run: dotnet build --no-restore --configuration Release

      # The integration suite drives real FFmpeg encodes. It skips itself when the
      # tools are absent, so this step is informational rather than a gate.
      # Which encoders and filters a build contains is decided at compile time, and the
      # tests skip themselves accordingly. Printing it here is what turns "19 tests
      # failed" into "this runner has no libvmaf".
      - name: Report FFmpeg build
        shell: pwsh
        continue-on-error: true
        run: |
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) {
            Write-Warning "FFmpeg not on PATH — integration tests will be SKIPPED."
            exit 0
          }
          Write-Host "FFmpeg at $($ff.Source)"
          & ffmpeg -hide_banner -version | Select-Object -First 1
          $encoders = (& ffmpeg -hide_banner -encoders 2>$null) -join "`n"
          $filters  = (& ffmpeg -hide_banner -filters  2>$null) -join "`n"
          foreach ($name in @("libx264","libx265","libsvtav1","libvpx-vp9")) {
            Write-Host ("encoder {0,-12} {1}" -f $name, $(if ($encoders -match "\s$name\s") { "yes" } else { "NO" }))
          }
          foreach ($name in @("libvmaf","ssim","psnr","xpsnr","scdet","subtitles")) {
            Write-Host ("filter  {0,-12} {1}" -f $name, $(if ($filters -match "\s$name\s") { "yes" } else { "NO" }))
          }

      - name: Run tests
        working-directory: src
        run: dotnet test --no-build --configuration Debug --verbosity normal

  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on:
      group: Default
      labels: [Linux]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build (Debug)
        working-directory: src
        run: dotnet build --no-restore --configuration Debug

      - name: Build (Release)
        working-directory: src
        run: dotnet build --no-restore --configuration Release

      # The integration suite drives real FFmpeg encodes. It skips itself when the
      # tools are absent, so this step is informational rather than a gate.
      # Which encoders and filters a build contains is decided at compile time, and the
      # tests skip themselves accordingly. Printing it here is what turns "19 tests
      # failed" into "this runner has no libvmaf".
      - name: Report FFmpeg build
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::warning::FFmpeg not on PATH — integration tests will be SKIPPED."
            exit 0
          fi
          echo "FFmpeg at $(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -1
          for name in libx264 libx265 libsvtav1 libvpx-vp9; do
            if ffmpeg -hide_banner -encoders 2>/dev/null | awk '{print $2}' | grep -qx "$name"; then
              echo "encoder $name: yes"
            else
              echo "encoder $name: NO"
            fi
          done
          for name in libvmaf ssim psnr xpsnr scdet subtitles; do
            if ffmpeg -hide_banner -filters 2>/dev/null | awk '{print $2}' | grep -qx "$name"; then
              echo "filter $name: yes"
            else
              echo "filter $name: NO"
            fi
          done

      - name: Run tests
        working-directory: src
        run: dotnet test --no-build --configuration Debug --verbosity normal

