name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build & Test (Windows)
    runs-on:
      group: Default
      labels: [Windows]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build (Debug)
        working-directory: src
        run: dotnet build --no-restore --configuration Debug

      - name: Build (Release)
        working-directory: src
        run: dotnet build --no-restore --configuration Release

      # The integration suite drives real FFmpeg encodes. It skips itself when the
      # tools are absent, so this step is informational rather than a gate.
      - name: Check FFmpeg availability
        shell: pwsh
        continue-on-error: true
        run: |
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ff) {
            Write-Host "FFmpeg found at $($ff.Source) — integration tests will run."
          } else {
            Write-Warning "FFmpeg not on PATH — integration tests will be SKIPPED. Install FFmpeg on this runner to enable them."
          }

      - name: Run tests
        working-directory: src
        run: dotnet test --no-build --configuration Debug --verbosity normal

  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on:
      group: Default
      labels: [Linux]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build (Debug)
        working-directory: src
        run: dotnet build --no-restore --configuration Debug

      - name: Build (Release)
        working-directory: src
        run: dotnet build --no-restore --configuration Release

      # The integration suite drives real FFmpeg encodes. It skips itself when the
      # tools are absent, so this step is informational rather than a gate.
      - name: Check FFmpeg availability
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg found at $(command -v ffmpeg) — integration tests will run."
          else
            echo "::warning::FFmpeg not on PATH — integration tests will be SKIPPED. Install FFmpeg on this runner to enable them."
          fi

      - name: Run tests
        working-directory: src
        run: dotnet test --no-build --configuration Debug --verbosity normal

